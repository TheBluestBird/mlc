name: MLC Release workflow
run-name: ${{ forge.actor }} is running MLC Release workflow on release ${{ forge.event.release.tag_name }}
on:
  release:
    types: [published]

jobs:
  Archlinux:
    runs-on: archlinux
    steps:
      - name: Download the release tarball
        run: curl -sL ${{ forge.server_url }}/${{ forge.repository }}/archive/${{ forge.event.release.tag_name }}.tar.gz --output tarball.tar.gz

      - name: Calculate SHA256 for the tarball
        run: echo "tbSum=$(sha256sum tarball.tar.gz | cut -d ' ' -f 1)" >> $FORGEJO_ENV

      - name: Unarchive tarball
        run: tar -xvzf tarball.tar.gz

      - name: Clone the AUR repository
        run: |
          echo "${{ secrets.DEPLOY_TO_AUR_PRIVATE_KEY }}" > key
          chmod 600 key
          GIT_SSH_COMMAND="ssh -i key -o 'IdentitiesOnly yes' -o 'StrictHostKeyChecking no'" git clone ssh://aur@aur.archlinux.org/mlc.git aur
          chmod 777 -R aur
          cd aur
          git config user.name ${{ secrets.DEPLOY_TO_AUR_USER_NAME }}
          git config user.email ${{ secrets.DEPLOY_TO_AUR_EMAIL }}


      - name: Copy PKGBUILD to the directory
        run: cp mlc/packaging/Archlinux/PKGBUILD aur/

      - name: Put version, tag and SHA256 sum to PKGBUILD file, and generate .SRCINFO
        working-directory: aur
        env:
          TAG: ${{ forge.event.release.tag_name }}
        run: |
          # tag 1.3.5 -> pkgver=1.3.5 pkgrel=1; tag 1.3.5-2 -> pkgver=1.3.5 pkgrel=2
          VER="${TAG%%-*}"
          REL="1"
          if [ "$VER" != "$TAG" ]; then REL="${TAG#*-}"; fi
          sed -i "s/^pkgver=.*/pkgver=${VER}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=${REL}/" PKGBUILD
          sed -i "s/^_tag=.*/_tag=\"${TAG}\"/" PKGBUILD
          sed -i "/sha256sums=/c\sha256sums=('${{ env.tbSum }}')" PKGBUILD
          cat PKGBUILD
          sudo -u build makepkg --printsrcinfo > .SRCINFO

      - name: Commit package to aur
        working-directory: aur
        env:
          BODY: ${{ forge.event.release.body }}
        run: |
          git add PKGBUILD .SRCINFO
          git commit -m "$BODY"
          GIT_SSH_COMMAND="ssh -i ../key -o 'IdentitiesOnly yes' -o 'StrictHostKeyChecking no'" git push
